# Authors
#
# Optional per-page author overrides.
#
# Add an entry here and reference it from a page's front matter with
# `author: <key>` to override the site-wide author profile defined in
# _config.yml for that page only.
#
# The site-wide author profile (name, bio, email, GitHub, Google Scholar, X)
# is configured under `author:` in _config.yml.